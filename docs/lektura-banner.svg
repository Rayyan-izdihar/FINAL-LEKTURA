    <rect x="280" y="414" width="154" height="42" rx="21" fill="#34404d"/>
    <text x="357" y="441" text-anchor="middle" fill="#f6f3e8">PostgreSQL</text>
    <rect x="448" y="414" width="132" height="42" rx="21" fill="#34404d"/>
    <text x="514" y="441" text-anchor="middle" fill="#f6f3e8">Raw SQL</text>
    <rect x="594" y="414" width="128" height="42" rx="21" fill="#c94444"/>
    <text x="658" y="441" text-anchor="middle" fill="#fffaf0">ExcelJS</text>
  </g>


  </g>

  <text x="112" y="275" fill="#f6f3e8" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="700" letter-spacing="2">LEKTURA</text>
  <text x="117" y="333" fill="#f6f3e8" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600">Katalog, sirkulasi, dan laporan perpustakaan.</text>
  <text x="117" y="378" fill="#d9d8d2" font-family="Arial, Helvetica, sans-serif" font-size="23">Satu ruang kerja untuk pengunjung, mahasiswa, pegawai, dan admin.</text>

  <g font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">
    <rect x="116" y="414" width="150" height="42" rx="21" fill="#2d604f"/>

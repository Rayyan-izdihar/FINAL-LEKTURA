<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">LEKTURA — Sistem Informasi Perpustakaan Kampus</title>
  <desc id="desc">Banner LEKTURA dengan tagline katalog, sirkulasi, dan laporan perpustakaan dalam satu tempat.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242b39"/>
      <stop offset="1" stop-color="#171c27"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6b96d" stop-opacity=".22"/>
      <stop offset="1" stop-color="#c94444" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="520" rx="34" fill="#f6f3e8"/>
  <rect x="24" y="24" width="1552" height="472" rx="28" fill="url(#panel)"/>
  <circle cx="1390" cy="110" r="185" fill="url(#glow)"/>
  <circle cx="1470" cy="440" r="170" fill="#f2c879" opacity=".07"/>
  <circle cx="1260" cy="250" r="205" fill="none" stroke="#f6f3e8" stroke-opacity=".12" stroke-width="2"/>

  <g transform="translate(112 118)">
    <rect width="72" height="72" rx="19" fill="#f6f3e8"/>
    <rect x="13" y="28" width="10" height="30" rx="2" fill="#c94444"/>
    <rect x="26" y="16" width="10" height="42" rx="2" fill="#d6a64e"/>
    <rect x="39" y="23" width="10" height="35" rx="2" fill="#2e755f"/>
